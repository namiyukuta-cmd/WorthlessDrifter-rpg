<title>街の片隅 — 生活サバイバル</title>
<style>
:root{color-scheme:dark;--bg:#0e1923;--panel:#172838;--line:#30495b;--paper:#eaf0e9;--soft:#a8bfca;--teal:#8ed5be;--amber:#ffcc89;--red:#f5a2a2;--shadow:#0b1219}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:14px;line-height:1.55}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}a{color:var(--teal)}.wrap{max-width:1120px;margin:auto;padding:0 18px 60px}.header{background:linear-gradient(170deg,#293f50,#142635 76%);border-bottom:1px solid #557083}.header-inner{max-width:1120px;margin:auto;padding:22px 18px 0}.eyebrow{text-transform:uppercase;letter-spacing:.21em;font-size:10px;color:#c7d7da;font-weight:800}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.top h1{font-size:clamp(24px,5vw,37px);line-height:1.15;margin:7px 0}.subtitle{font-size:12px;color:#c9d6df;margin:0}.small-btn{border:1px solid #8b9da7;color:#e5f2f2;background:#243b4c;padding:8px 10px;border-radius:8px;white-space:nowrap;font-size:12px}.scene{position:relative;height:110px;margin-top:14px;overflow:hidden;background:linear-gradient(180deg,transparent,#132334)}.moon{position:absolute;right:18%;top:10px;width:31px;height:31px;border-radius:50%;background:#e6debb;box-shadow:0 0 22px #dcc79955}.building{position:absolute;bottom:0;width:13%;background:#0c1923;border:2px solid #263d4c;border-bottom:0}.building:after{content:"";position:absolute;inset:10px 9px;background:repeating-linear-gradient(90deg,#ffd69588 0 5px,transparent 5px 16px);opacity:.55;mask-image:repeating-linear-gradient(0deg,#000 0 5px,transparent 5px 16px)}.building:nth-child(2){left:0;height:53px}.building:nth-child(3){left:12%;height:83px}.building:nth-child(4){left:25%;height:65px}.building:nth-child(5){left:40%;height:104px}.building:nth-child(6){left:55%;height:71px}.building:nth-child(7){left:69%;height:91px}.building:nth-child(8){left:83%;height:59px;width:17%}.street{position:absolute;bottom:0;width:100%;border-bottom:5px solid #405060}.now{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#223a49;padding:10px 14px;margin:0 -18px;border-top:1px solid #41566a;font-weight:800}.now span+span{border-left:1px solid #587081;padding-left:11px}.now small{font-weight:400;color:#b8ccd5}.section-title{font-size:15px;margin:24px 0 10px;letter-spacing:.05em}.lead{color:var(--soft);font-size:12px;margin:4px 0 15px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:12px;min-width:0}.stat-head{display:flex;gap:4px;justify-content:space-between;align-items:baseline;font-size:11px;color:#c7d4de}.stat b{font-size:18px;color:#fff}.stat .track{height:7px;background:#0b1822;border-radius:8px;margin-top:9px;overflow:hidden}.stat .fill{height:100%;background:var(--teal);border-radius:8px;transition:width .22s}.stat.warn .fill{background:var(--amber)}.stat.danger .fill{background:var(--red)}.summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:11px}.chip{border:1px solid #3e5868;background:#1e3040;border-radius:99px;padding:6px 11px;color:#d2e2e8;font-size:12px}.chip b{color:#fff}.columns{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 8px 18px #020b1433}.card h3{font-size:15px;margin:0 0 7px}.loc-list{display:grid;gap:7px}.loc-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:#203547;border:1px solid #355366;color:#e6edf2;border-radius:10px;padding:11px}.loc-btn strong{font-size:13px}.loc-btn small{display:block;font-size:10px;font-weight:400;color:#a9c1cc;margin-top:2px}.loc-btn.active{border-color:var(--teal);background:#28504f;box-shadow:inset 3px 0 var(--teal)}.loc-emoji{font-size:20px;flex:0 0 26px}.loc-copy{flex:1}.distance{font-size:10px;color:#b4c7ce;white-space:nowrap}.location-intro{color:#c8d7dc;font-size:13px;margin:0 0 12px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{display:block;text-align:left;min-height:114px;background:#223a4a;color:#eef5f4;border:1px solid #416276;border-radius:12px;padding:13px;transition:background .15s,border-color .15s}.action:not(:disabled):hover,.action:not(:disabled):active{background:#2e4d5a;border-color:#9ed7c6}.action strong{display:block;font-size:14px;margin-bottom:5px}.action .desc{display:block;font-size:11px;color:#c3d3d8;line-height:1.45}.action .meta{display:block;margin-top:9px;color:var(--amber);font-size:11px;font-weight:800}.action:disabled .meta{color:#c5a8a8}.items{display:flex;flex-wrap:wrap;gap:8px}.item-btn{border:1px solid #4a6772;background:#233b49;color:#edf3f2;border-radius:10px;padding:10px 12px;text-align:left;flex:1;min-width:120px}.item-btn strong,.item-btn small{display:block}.item-btn small{font-size:11px;color:#b6cfce}.log{list-style:none;padding:0;margin:0;max-height:390px;overflow:auto}.log li{border-bottom:1px solid #294253;padding:9px 2px;color:#d4e0e3;font-size:12px}.log li:first-child{color:#fff}.log time{display:block;font-size:10px;color:#95b3bf;margin-bottom:3px}.hint{font-size:12px;color:#b6cbd0;margin:0}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.progress div{background:#0f2231;border:1px solid #2d4658;border-radius:9px;padding:11px;text-align:center}.progress b{display:block;color:var(--teal);font-size:18px}.progress small{color:#bbcdd4;font-size:10px}.rules{font-size:11px;color:#9fbac5}.primary{border:1px solid #9bdfca;background:#8ed5be;color:#092421;padding:11px 16px;border-radius:9px;font-weight:800}.secondary{border:1px solid #6f8490;background:#274251;color:#e7eff0;padding:11px 16px;border-radius:9px;font-weight:700}.overlay{position:fixed;inset:0;background:#050d14d9;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:min(100%,550px);background:#192e3e;border:1px solid #7aa3a7;border-radius:17px;padding:26px;box-shadow:0 22px 60px #0009}.dialog h2{margin:0 0 10px;font-size:24px}.dialog p{color:#d6e4e7}.dialog .buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.hidden{display:none!important}.footer{margin-top:15px;color:#8faab6;font-size:11px;text-align:center}.notice{font-size:11px;color:#9dbac3;padding:8px 0}.message{background:#203848;border-left:3px solid var(--teal);padding:11px;margin-bottom:12px;color:#eaf2f4}.message strong{color:var(--amber)}
@media(max-width:800px){.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.now{font-size:12px}.action{min-height:102px}.wrap{padding:0 12px 40px}.now{margin:0 -18px}}@media(max-width:380px){.actions{grid-template-columns:1fr}.top h1{font-size:24px}.progress b{font-size:14px}.loc-btn{padding:9px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="top"><div><div class="eyebrow">A street survival story</div><h1>街の片隅</h1><p class="subtitle">現代都市で、今日を越えて住まいを探す生活サバイバル</p></div><button class="small-btn" id="resetBtn">最初から</button></div><div class="scene" aria-hidden="true"><i class="moon"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><div class="street"></div></div><div class="now" id="clock"></div></div></header>
<main class="wrap">
<h2 class="section-title">現在の状態</h2><div id="stats" class="stats"></div><div id="summary" class="summary"></div>
<div class="columns"><aside><h2 class="section-title">街を歩く</h2><div class="card"><p class="hint" style="margin-bottom:10px">移動は20分。行動する場所によってできることが変わります。</p><div id="places" class="loc-list"></div></div><div class="card"><h3>持ち物</h3><div id="items" class="items"></div></div><div class="card"><h3>住まいへの道</h3><p class="hint">支援センターで必要な手続きを終え、申込金と就労記録をそろえると住まいを申し込めます。</p><div id="progress" class="progress" style="margin-top:10px"></div><p class="rules" style="margin:10px 0 0">目標：20,000円・書類3・就労記録3</p></div></aside>
<section><h2 class="section-title">今いる場所</h2><div class="card"><h3 id="placeName"></h3><p class="location-intro" id="placeDesc"></p><div id="notice" class="message hidden"></div><div id="actions" class="actions"></div></div><div class="card"><h3>今日までの記録</h3><ul class="log" id="log" aria-live="polite"></ul></div></section></div>
<p class="footer">オリジナル作品。『CHANGE: A Homeless Survival Experience』の素材・文章・プログラムは使用していません。進行は端末に自動保存されます。</p>
</main>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="dialog"><div class="eyebrow" id="dialogOver"></div><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="buttons" id="dialogButtons"></div></div></div>
<script>
(()=>{'use strict';
const KEY='machi-no-sumika-v1';
const WEATHER=[{name:'晴れ',temp:17,loss:1},{name:'曇り',temp:13,loss:2},{name:'雨',temp:9,loss:5},{name:'冷え込む日',temp:5,loss:7}];
const PLACES={market:{label:'商店街',icon:'🏪',short:'買い物・物乞い',desc:'店の灯りが並ぶ通り。食べ物や生活用品を買えるほか、通行人に助けを求めることもできます。'},station:{label:'駅前',icon:'🚉',short:'仕事探し・物乞い',desc:'朝夕の人通りが多い駅前。仕事の募集掲示板があり、夜は軒下に身を寄せる人もいます。'},park:{label:'公園',icon:'🌳',short:'休憩・資源回収',desc:'ベンチと水飲み場のある公園。拾えるものもありますが、夜の寒さと雨には注意が必要です。'},center:{label:'支援センター',icon:'🏠',short:'無料食・衛生・手続き',desc:'食事、シャワー、手続きの相談、宿泊先の紹介。窓口の時間と利用回数には限りがあります。'},library:{label:'図書館',icon:'📚',short:'勉強・休息',desc:'静かな公共図書館。日中は無料で暖を取り、仕事に役立つ知識を身につけられます。'},warehouse:{label:'倉庫街',icon:'🏗️',short:'日雇い・安宿',desc:'朝には日雇いの募集があります。通りの奥には低料金で泊まれる簡易宿泊所もあります。'}};
const S=(id)=>document.getElementById(id);const cap=(v)=>Math.max(0,Math.min(100,Math.round(v)));const yen=(v)=>'¥'+Math.max(0,Math.floor(v)).toLocaleString('ja-JP');const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const initial=()=>({v:1,day:1,min:7*60,place:'station',weather:1,cash:1100,food:63,energy:78,health:85,warm:73,hygiene:57,mood:63,docs:0,work:0,study:0,coat:false,job:false,items:{bread:1,water:1,warmer:0},used:{},lastSleep:0,finished:false,ended:false,log:[{day:1,min:420,text:'朝7時。駅前で目を覚ましました。所持金は1,100円。今日をどう過ごしますか。'}]});
let st;try{st=JSON.parse(localStorage.getItem(KEY));if(!st||st.v!==1||!PLACES[st.place]||!st.items||!Array.isArray(st.log))st=null}catch(e){st=null}if(!st)st=initial();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function clock(m=st.min){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function stamp(){return `Day ${st.day}・${clock()}`}
function log(t){st.log.unshift({day:st.day,min:st.min,text:t});st.log=st.log.slice(0,45)}
function change(d){for(const [key,val] of Object.entries(d)){if(key==='cash')st.cash=Math.max(0,st.cash+val);else if(['docs','work','study'].includes(key))st[key]=Math.max(0,st[key]+val);else st[key]=cap(st[key]+val)}}
function outdoors(){return st.place!=='center'&&st.place!=='library'}
function tick(minutes,{sleep=false,inside=false}={}){let remain=Math.max(0,Math.round(minutes));while(remain>0){const step=Math.min(remain,30,1440-st.min);const hours=step/60;change({food:-5.5*hours,energy:sleep?0:-3.7*hours,hygiene:(sleep?-.3:-.85)*hours});if(!sleep&&st.food<18)change({health:-1.5*hours,mood:-1*hours});if(!sleep&&st.energy<15)change({health:-.9*hours,mood:-.7*hours});if(!inside&&outdoors()){const chill=WEATHER[st.weather].loss*(st.coat?.5:1)*hours*(st.min>=19*60||st.min<6*60?1.7:1);change({warm:-chill});}else change({warm:2.5*hours});if(st.warm<18)change({health:-1.7*hours});st.min+=step;remain-=step;if(st.min>=1440){st.min=0;st.day++;st.weather=rand(0,WEATHER.length-1);st.used={};log('日付が変わりました。天候は「'+WEATHER[st.weather].name+'」です。');}}check();}
function costOK(n){return st.cash>=n}
function used(id){return st.used[id]===st.day}
function once(id){st.used[id]=st.day}
function after(text){log(text);check();save();render();}
function notify(msg){const n=S('notice');n.textContent=msg;n.classList.remove('hidden');}
function doAct(act){if(st.ended||st.finished)return;if(act.req&&!act.req())return;S('notice').classList.add('hidden');act.run();save();render();}
function sleep(kind,price){if(!costOK(price))return;let hour=st.min;
if(hour<17*60&&hour>=6*60)return; if(st.min<6*60){/* early morning counts as a night already underway */}
let hours=(st.min>=7*60)?(24*60-st.min+7*60):(7*60-st.min);hours=Math.max(90,hours);const startDay=st.day;change({cash:-price});tick(hours,{sleep:true,inside:kind!=='park'&&kind!=='station'});
const gains={center:{energy:66,warm:45,health:7,mood:12},hostel:{energy:76,warm:52,health:8,mood:12},park:{energy:37,warm:-21,health:-5,mood:-6},station:{energy:42,warm:-14,health:-3,mood:-4}};
change(gains[kind]);if((kind==='park'||kind==='station')&&WEATHER[st.weather].loss>=5)change({health:-6,warm:-12});st.lastSleep=startDay;const names={center:'シェルター',hostel:'簡易宿泊所',park:'公園のベンチ',station:'駅の軒下'};after(names[kind]+'で夜を過ごし、朝7時になりました。'+(price?' 宿泊費 '+yen(price)+'。':''));}
function actions(){const A=[];const add=(id,title,desc,meta,req,run,fail='条件を満たしていません')=>A.push({id,title,desc,meta,req,run,fail});const daytime=(start,end,dur=0)=>st.min>=start*60&&st.min+dur<=end*60;const canSleep=()=>st.min>=17*60||st.min<6*60;const act=(mins,delta,text,{inside=false}={})=>{tick(mins,{inside});change(delta);after(text)};
switch(st.place){
case'market':
add('bread','パンを買う','買って、その場で食べます。満腹度＋35、気分＋2。','30分・280円',()=>costOK(280)&&daytime(7,22,30),()=>act(30,{cash:-280,food:35,mood:2},'パンを280円で買って食べました。'),'営業時間外、または所持金が不足');
add('meal','弁当を買う','温かい食事。満腹度＋65、気分＋5。','45分・680円',()=>costOK(680)&&daytime(7,22,45),()=>act(45,{cash:-680,food:65,mood:5,warm:6},'弁当に680円を使い、食事をしました。'),'営業時間外、または所持金が不足');
add('soap','洗面用品を買う','公衆トイレで身なりを整えます。衛生＋33。','30分・200円',()=>costOK(200)&&daytime(7,22,30),()=>act(30,{cash:-200,hygiene:33,mood:1},'洗面用品に200円を使って身なりを整えました。'),'営業時間外、または所持金が不足');
add('coat','防寒着を買う',st.coat?'すでに持っています。':'外で冷えにくくなります。','30分・2,400円',()=>!st.coat&&costOK(2400)&&daytime(7,22,30),()=>{tick(30);change({cash:-2400,warm:27});st.coat=true;after('2,400円で防寒着を購入しました。')},'購入済み、営業時間外、または所持金が不足');
add('begMarket','通行人に声をかける','お願いできる相手を探します。結果は一定ではありません。','1時間・収入0〜560円',()=>true,()=>{tick(60);const earn=rand(0,5)===0?0:rand(70,560);change({cash:earn,mood:earn?1:-3});after(earn?`声をかけて${yen(earn)}を受け取りました。`:'1時間声をかけましたが、収入はありませんでした。')});
break;
case'station':
add('begStation','物乞いをする','通行人に援助を求めます。衛生が高いほど受け取りやすくなります。','1時間・収入0〜500円',()=>true,()=>{tick(60);const chance=st.hygiene>=35?75:45;const earn=rand(1,100)<=chance?rand(50,500):0;change({cash:earn,mood:earn?0:-2});after(earn?`駅前で${yen(earn)}を受け取りました。`:'駅前で声をかけ続けましたが、収入はありませんでした。')});
add('jobBoard','求人を調べる','職探しの条件を確認します。申請書類3・就労記録2・衛生40で応募できます。','30分・無料',()=>daytime(7,21,30),()=>{tick(30);after('求人を確認しました。常勤の仕事には書類3・就労記録2・衛生40が必要です。')},'掲示板を確認できる時間外');
add('interview','定職の面接を受ける','条件を満たせば継続勤務を始められます。','2時間・無料',()=>!st.job&&st.docs>=3&&st.work>=2&&st.hygiene>=40&&daytime(9,16,120),()=>{tick(120,{inside:true});change({energy:-7,mood:8});st.job=true;after('面接が終わり、継続勤務が決まりました。駅前で日中に働けます。')},'書類3・就労記録2・衛生40、平日日中相当の時間帯が必要');
add('shift','継続勤務で働く','就職後の仕事。収入5,800円。','5時間・収入5,800円',()=>st.job&&!used('shift')&&st.energy>=35&&daytime(8,17,300),()=>{once('shift');act(300,{cash:5800,energy:-15,food:-6,mood:3,work:1},'5時間働き、給与5,800円を受け取りました。')},'就職・体力35以上・8〜17時・1日1回');
add('sleepStation','駅の軒下で眠る','無料。寒さと体調悪化の危険があります。','翌07:00まで・0円',canSleep,()=>sleep('station',0),'17時〜翌6時に選べます');
break;
case'park':
add('recyclePark','空き缶を集める','回収して換金します。衛生と体力を消耗します。','2時間・収入160〜500円',()=>st.energy>=15,()=>{tick(120);const amount=rand(160,500);change({cash:amount,energy:-10,hygiene:-13});after(`空き缶を換金して${yen(amount)}を得ました。`)},'体力15以上が必要');
add('bench','ベンチで休む','体力を少し戻します。雨の日には冷えます。','1時間・無料',()=>true,()=>act(60,{energy:15,mood:2},'公園のベンチで休みました。'));
add('fountain','水場で洗う','顔と手を洗い、水を飲みます。','30分・無料',()=>true,()=>act(30,{hygiene:16,food:3},'水場で顔と手を洗い、水を飲みました。'));
add('search','使える物を探す','公園周辺の落とし物や空き容器を探します。','1時間・物資が見つかることも',()=>st.energy>=10,()=>{tick(60);change({energy:-5,hygiene:-6});const r=rand(1,100);if(r<=38){st.items.bread++;after('未開封のパンを1個見つけました。')}else if(r<=70){st.items.water++;after('水のペットボトルを1本見つけました。')}else after('使える物は見つかりませんでした。')},'体力10以上が必要');
add('sleepPark','公園で夜を過ごす','無料。寒さ・雨・体調悪化の危険が大きい。','翌07:00まで・0円',canSleep,()=>sleep('park',0),'17時〜翌6時に選べます');
break;
case'center':
add('mealFree','無料の食事を受ける','食事の配布を受けます。満腹度＋48。','1時間・無料・1日1回',()=>!used('meal')&&daytime(8,19,60),()=>{once('meal');act(60,{food:48,warm:8,mood:3},'支援センターで食事を受け取りました。',{inside:true})},'8〜19時・1日1回');
add('shower','シャワーを使う','衛生＋55。温かさも回復します。','1時間・無料・1日1回',()=>!used('shower')&&daytime(9,19,60),()=>{once('shower');act(60,{hygiene:55,warm:23,mood:3},'シャワーを浴びて体を洗いました。',{inside:true})},'9〜19時・1日1回');
add('paperwork','必要書類の相談','本人確認や手続きを進めます。書類＋1（最大3）。','2時間・無料',()=>st.docs<3&&daytime(9,17,120)&&!used('docs'),()=>{once('docs');act(120,{docs:1,energy:-4},'相談窓口で必要書類を1段階進めました。',{inside:true})},'9〜17時・1日1回・書類は最大3');
add('clinic','健康相談を受ける','休養や診療の支援を受けます。健康＋28。','2時間・無料・1日1回',()=>!used('clinic')&&daytime(9,18,120),()=>{once('clinic');act(120,{health:28,warm:15,mood:6},'健康相談と休養を受けました。',{inside:true})},'9〜18時・1日1回');
add('housing','住まいを申し込む','条件達成で住まいが見つかり、クリアです。','2時間・申込金20,000円',()=>st.cash>=20000&&st.docs>=3&&st.work>=3&&daytime(9,17,120),()=>{tick(120,{inside:true});change({cash:-20000});st.finished=true;log('手続きを終え、住まいの鍵を受け取りました。');save();render();showEnd(true)},'20,000円・書類3・就労記録3・9〜17時が必要');
add('shelter','シェルターで眠る','無料。利用受付は17〜21時。安全に休めます。','翌07:00まで・0円',()=>st.min>=17*60&&st.min<=21*60,()=>sleep('center',0),'受付は17〜21時');
break;
case'library':
add('study','就労について勉強する','学習＋1。就労の選択肢を増やす準備です。','2時間・無料',()=>daytime(9,19,120),()=>act(120,{study:1,mood:3,energy:-2,warm:12},'図書館で仕事と暮らしについて調べました。',{inside:true}),'9〜19時');
add('restLibrary','館内で休憩する','静かな屋内で体力・体温・気分が少し回復します。','1時間・無料',()=>daytime(9,19,60),()=>act(60,{energy:14,warm:19,mood:5},'図書館で静かに休憩しました。',{inside:true}),'9〜19時');
add('waterLibrary','飲み水を補充する','飲料水を1本持ち帰ります。','30分・無料・1日1回',()=>!used('libraryWater')&&daytime(9,19,30),()=>{once('libraryWater');tick(30,{inside:true});st.items.water++;after('図書館で飲料水を1本補充しました。')},'9〜19時・1日1回');
break;
case'warehouse':
add('labor','日雇いで働く','4時間の荷物運搬。体力と衛生を消耗します。','4時間・収入3,400円',()=>!used('labor')&&st.energy>=35&&st.health>=35&&daytime(7,19,240),()=>{once('labor');act(240,{cash:3400,energy:-17,hygiene:-16,food:-7,work:1,mood:2},'日雇いの仕事を終え、3,400円の賃金と就労記録1を得ました。')},'7〜19時・健康35・体力35以上・1日1回');
add('recycleWarehouse','資源を回収する','2時間の回収。体力と衛生を消耗します。','2時間・収入280〜620円',()=>st.energy>=16,()=>{tick(120);const amount=rand(280,620);change({cash:amount,energy:-11,hygiene:-10});after(`資源の回収で${yen(amount)}を得ました。`)},'体力16以上が必要');
add('hostel','簡易宿泊所に泊まる','900円で布団を借ります。健康と体力を回復できます。','翌07:00まで・900円',()=>canSleep()&&costOK(900),()=>sleep('hostel',900),'17時〜翌6時、900円が必要');
break;
}
return A;}
function move(id){if(st.ended||st.finished||st.place===id)return;tick(20);st.place=id;log(PLACES[id].label+'へ移動しました（20分）。');save();render()}
const ITEMS={bread:{label:'パン',description:'満腹度＋35',delta:{food:35,mood:1}},water:{label:'飲料水',description:'満腹度＋7・体力＋5',delta:{food:7,energy:5}},warmer:{label:'カイロ',description:'体温＋25',delta:{warm:25}}};
function consume(id){if(st.ended||st.finished||!st.items[id])return;st.items[id]--;tick(10);change(ITEMS[id].delta);after(ITEMS[id].label+'を使いました。')}
function check(){if(st.health<=0&&!st.ended&&!st.finished){st.ended=true;log('体調が限界になり、これ以上の行動ができなくなりました。');save();showEnd(false)}}
function button(label,run,primary=false){const b=document.createElement('button');b.type='button';b.className=primary?'primary':'secondary';b.textContent=label;b.onclick=run;return b}
function modal(over,title,body,actions){S('dialogOver').textContent=over;S('dialogTitle').textContent=title;S('dialogBody').innerHTML=body;const holder=S('dialogButtons');holder.replaceChildren(...actions);S('overlay').classList.remove('hidden')}
function dismiss(){S('overlay').classList.add('hidden')}
function newGame(){st=initial();save();dismiss();render();notify('新しい一日が始まりました。まずは無料食と日雇いの仕事を探してみてください。')}
function showEnd(won){modal(won?'CLEAR · 生活の再出発':'GAME OVER · 生活の記録',won?'新しい部屋の鍵':'今日は、ここまで',won?`<p>${st.day}日目。必要な手続きと仕事を積み重ね、住まいが決まりました。</p><p>最後の所持金：<b>${yen(st.cash)}</b>。ここで一つの物語が終わります。</p>`:`<p>${st.day}日目。体調が限界に達しました。今回の記録はここで終了です。</p><p>所持金 ${yen(st.cash)}・書類 ${st.docs}/3・就労記録 ${st.work}/3。最初から別の選択で遊べます。</p>`,[button('もう一度遊ぶ',newGame,true),button('記録を見る',dismiss)])}
function intro(){modal('GAME GUIDE','駅前で、朝が来ました','<p>手元には1,100円とパン1個、水1本。住まいはありません。</p><p>街を移動し、食べ物を確保し、体力・衛生・健康を守りながら仕事を探してください。支援センターの利用、書類の手続き、就労記録を重ねると住まいに申し込めます。</p><p>所持金・体力・空腹・天候にはすべて影響があります。行動には時間がかかり、夜は寝場所を選ぶ必要があります。</p><p class="rules">操作：行き先を選択 → 行動する。自動保存。スマートフォン対応。</p>',[button('ゲームを始める',dismiss,true)])}
function render(){S('clock').innerHTML=`<span>DAY ${st.day} <small>${clock()}</small></span><span>${WEATHER[st.weather].name} <small>${WEATHER[st.weather].temp}℃</small></span><span>所持金 <small>${yen(st.cash)}</small></span>`;
const attrs=[['food','満腹度'],['energy','体力'],['health','健康'],['warm','体温'],['hygiene','衛生'],['mood','気分']];S('stats').innerHTML=attrs.map(([key,title])=>{let val=st[key];return `<div class="stat ${val<=22?'danger':val<=45?'warn':''}"><div class="stat-head"><span>${title}</span><b>${val}<small>/100</small></b></div><div class="track"><div class="fill" style="width:${val}%"></div></div></div>`}).join('');
S('summary').innerHTML=`<div class="chip">書類 <b>${st.docs}/3</b></div><div class="chip">就労記録 <b>${st.work}/3</b></div><div class="chip">学習 <b>${st.study}</b></div><div class="chip">継続勤務 <b>${st.job?'採用済':'未採用'}</b></div><div class="chip">防寒着 <b>${st.coat?'あり':'なし'}</b></div>`;
S('places').innerHTML=Object.entries(PLACES).map(([id,p])=>`<button class="loc-btn ${st.place===id?'active':''}" data-place="${id}" ${st.finished||st.ended?'disabled':''}><span class="loc-emoji">${p.icon}</span><span class="loc-copy"><strong>${p.label}</strong><small>${p.short}</small></span><span class="distance">${st.place===id?'現在地':'20分'}</span></button>`).join('');S('places').querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>move(b.dataset.place));
S('placeName').textContent=PLACES[st.place].icon+' '+PLACES[st.place].label;S('placeDesc').textContent=PLACES[st.place].desc;
const A=actions();S('actions').innerHTML=A.map(a=>{const ok=!st.ended&&!st.finished&&a.req();return `<button class="action" data-act="${a.id}" ${ok?'':'disabled'} title="${ok?a.desc:a.fail}"><strong>${a.title}</strong><span class="desc">${a.desc}</span><span class="meta">${ok?a.meta:a.fail}</span></button>`}).join('');S('actions').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const x=A.find(a=>a.id===b.dataset.act);if(x)doAct(x)});
S('items').innerHTML=Object.entries(ITEMS).map(([id,x])=>`<button class="item-btn" data-item="${id}" ${st.items[id]&&!st.ended&&!st.finished?'':'disabled'}><strong>${x.label} ×${st.items[id]||0}</strong><small>${x.description}・10分</small></button>`).join('');S('items').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>consume(b.dataset.item));
S('progress').innerHTML=`<div><b>${yen(st.cash)}</b><small>/ ${yen(20000)}</small></div><div><b>${st.docs}/3</b><small>書類</small></div><div><b>${st.work}/3</b><small>就労記録</small></div>`;
S('log').innerHTML=st.log.slice(0,15).map(e=>`<li><time>Day ${e.day}・${clock(e.min)}</time>${e.text}</li>`).join('');}
S('resetBtn').onclick=()=>modal('NEW GAME','最初から始めますか？','<p>現在の進行は消去され、駅前の朝から再スタートします。</p>',[button('キャンセル',dismiss),button('最初から始める',newGame,true)]);
render();if(st.finished||st.ended)showEnd(st.finished);else if(!localStorage.getItem(KEY))intro();
})();
</script>
</body>
</html>
