name: oneoff-health-recovery
on:
  push:
    branches:
      - health-recovery-menu
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Use health recovery menu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-recovery-menu
      - name: Refactor recovery UI
        shell: python
        run: |
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.stat strong{font-size:19px}'
          new=old+'.health-stat{cursor:pointer;position:relative}.health-stat:active{transform:translateY(1px)}.health-stat small span{font-size:9px;margin-left:4px;color:#9a8068}.recovery-layer{position:fixed;inset:0;z-index:180;display:none;background:#0006;padding:12px;align-items:center;justify-content:center}.recovery-layer.open{display:flex}.recovery-box{width:min(430px,100%);max-height:80dvh;overflow:auto;background:#fff9f0;border:2px solid #6c5b4d;border-radius:14px;padding:12px;box-shadow:0 14px 45px #0007}.recovery-head{display:flex;align-items:center;gap:8px}.recovery-head h2{margin:0}.recovery-head button{margin-left:auto;border:1px solid #a5917c;border-radius:7px;background:#eee0d0;padding:7px 10px}.recovery-actions{display:grid;gap:8px;margin-top:10px}.recovery-actions button{border:1px solid #927c67;border-radius:9px;background:#f0dfca;padding:11px;text-align:left;font-weight:800}.recovery-actions button:disabled{opacity:.45}'
          if old not in s: raise SystemExit('stat style marker not found')
          s=s.replace(old,new,1)

          old='<div class="stat"><small>体力</small><strong id="healthValue">10 / 10</strong></div><div class="stat"><small>満腹度</small><strong id="hungerValue">2 / 10</strong></div><div class="stat"><small>水分</small><strong id="thirstValue">2 / 10</strong></div>'
          new='<div id="healthStat" class="stat health-stat"><small>体力 <span>タップで回復</span></small><strong id="healthValue">10 / 10</strong></div>'
          if old not in s: raise SystemExit('needs stats marker not found')
          s=s.replace(old,new,1)

          marker='<div id="saveLayer" class="save-layer">'
          recovery='<div id="healthLayer" class="recovery-layer"><div class="recovery-box"><div class="recovery-head"><h2>体力を回復</h2><button id="closeHealth">閉じる</button></div><div id="healthMeta" class="note"></div><div id="healthActions" class="recovery-actions"></div></div></div>\n'
          if marker not in s: raise SystemExit('save layer marker not found')
          s=s.replace(marker,recovery+marker,1)
          if '<script src="js/needs.js"></script>' not in s: raise SystemExit('needs script marker not found')
          s=s.replace('<script src="js/needs.js"></script>','<script src="js/health.js"></script>',1)
          p.write_text(s,encoding='utf-8')

          p=Path('js/state.js')
          s=p.read_text(encoding='utf-8')
          old='health:10,maxHealth:10,hunger:2,maxHunger:10,thirst:2,maxThirst:10,money:380'
          new='health:10,maxHealth:10,money:380'
          if old not in s: raise SystemExit('state needs marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('js/inventory.js')
          s=p.read_text(encoding='utf-8')
          if 'function render(){ensureConsumables();' not in s: raise SystemExit('render ensure marker not found')
          s=s.replace('function render(){ensureConsumables();','function render(){ensureRecoveryItems();',1)
          target="$('hungerValue').textContent=(state.hunger??2)+' / '+(state.maxHunger??10);$('thirstValue').textContent=(state.thirst??2)+' / '+(state.maxThirst??10);"
          if target not in s: raise SystemExit('render needs marker not found')
          s=s.replace(target,'',1)
          start=s.index('function info(it)')
          end=s.index('function down(e)',start)
          info="""function info(it){let c=it.consume,extra='';if(c?.type==='drink'){let left=c.uses??0;extra+='<span class=\"chip\">残り '+left+' / '+(c.maxUses??left)+'</span>'}if(c?.type==='food'||c?.type==='drink')extra+='<br><span class=\"note\">回復するときはINDEXの体力をタップ。</span>';$('info').innerHTML='<strong>'+it.icon+' '+it.name+'</strong><br><span class=\"chip\">大きさ '+it.w+'×'+it.h+'</span><span class=\"chip\">本体 '+it.weight.toFixed(1)+'kg</span>'+(it.inner?'<span class=\"chip\">収納 '+it.inner.cols+'×'+it.inner.rows+'</span><span class=\"chip\">中身上限 '+it.inner.maxWeight.toFixed(1)+'kg</span>':'')+extra}\n"""
          s=s[:start]+info+s[end:]
          p.write_text(s,encoding='utf-8')

          health=r'''function ensureRecoveryItems(){let b=item('bottle');if(b&&!b.consume)b.consume={type:'drink',amount:3,uses:3,maxUses:3,emptyWeight:.2,unitWeight:.3};let br=item('bread');if(br&&!br.consume)br.consume={type:'food',amount:3,remove:true};if(b?.consume?.type==='drink'){if(b.consume.uses==null)b.consume.uses=b.consume.maxUses??3;if(b.consume.maxUses==null)b.consume.maxUses=3;if(b.consume.emptyWeight==null)b.consume.emptyWeight=.2;if(b.consume.unitWeight==null)b.consume.unitWeight=.3;b.weight=b.consume.emptyWeight+b.consume.unitWeight*b.consume.uses;if(b.consume.uses<=0)b.name='空の水筒'}}
function humanItem(it){let p=it?.parent,seen=new Set();while(p){if(p==='main'||p==='loose')return true;if(p==='pet')return false;if(!p.startsWith('container:'))return false;let id=p.slice(10);if(seen.has(id))return false;seen.add(id);p=item(id)?.parent}return false}
function recoveryItems(){ensureRecoveryItems();return state.items.filter(it=>humanItem(it)&&it.consume&&(it.consume.type==='food'||(it.consume.type==='drink'&&(it.consume.uses??0)>0)))}
function recoverHealth(amount){let max=state.maxHealth??10,old=state.health??max;state.health=Math.min(max,old+amount);return state.health-old}
function useRecoveryItem(id){let it=item(id);if(!it||!humanItem(it)||!it.consume)return;let max=state.maxHealth??10;if((state.health??max)>=max)return toast('体力は満タンです');let c=it.consume,name=it.name,gain=recoverHealth(c.amount||3);if(c.type==='food'){if(c.remove)state.items=state.items.filter(x=>x.id!==id);toast(name+'を食べて体力 +'+gain)}else if(c.type==='drink'){c.uses=Math.max(0,(c.uses??0)-1);it.weight=(c.emptyWeight??.2)+(c.unitWeight??.3)*c.uses;if(c.uses<=0)it.name='空の水筒';toast('水を飲んで体力 +'+gain)}markDirty();render();renderHealthMenu()}
function sleepRecovery(){let max=state.maxHealth??10;if((state.health??max)>=max)return toast('体力は満タンです');let gain=recoverHealth(5);markDirty();render();renderHealthMenu();toast('眠って体力 +'+gain)}
function renderHealthMenu(){let max=state.maxHealth??10,cur=state.health??max,full=cur>=max,items=recoveryItems();$('healthMeta').textContent='体力 '+cur+' / '+max+(full?' ・ 満タン':'');let a=$('healthActions');a.innerHTML='';for(let it of items){let c=it.consume,b=document.createElement('button');let verb=c.type==='food'?'食べる':'飲む',detail=c.type==='drink'?' ・ 残り '+(c.uses??0)+' / '+(c.maxUses??c.uses??0):'';b.textContent=it.icon+' '+it.name+'を'+verb+'　体力 +'+(c.amount||3)+detail;b.disabled=full;b.onclick=()=>useRecoveryItem(it.id);a.appendChild(b)}if(!items.length){let n=document.createElement('div');n.className='note';n.textContent='食べ物や飲み物は所持していません。';a.appendChild(n)}let sleep=document.createElement('button');sleep.textContent='眠る　体力 +5';sleep.disabled=full;sleep.onclick=sleepRecovery;a.appendChild(sleep)}
function openHealth(){if(!activeId)return toast('先にセーブデータを作ってください');renderHealthMenu();$('healthLayer').classList.add('open')}
function closeHealth(){$('healthLayer').classList.remove('open')}
$('healthStat').addEventListener('click',openHealth);$('closeHealth').addEventListener('click',closeHealth);$('healthLayer').addEventListener('click',e=>{if(e.target===$('healthLayer'))closeHealth()});
'''
          Path('js/health.js').write_text(health,encoding='utf-8')
          Path('js/needs.js').unlink(missing_ok=True)
          Path('.github/trigger-health-recovery').unlink(missing_ok=True)
          Path('.github/workflows/oneoff-health-recovery.yml').unlink(missing_ok=True)
      - name: Check JavaScript
        run: |
          for f in js/*.js; do node --check "$f"; done
          grep -q 'js/health.js' index.html
          test ! -e js/needs.js
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use health recovery menu"
          git push origin HEAD:health-recovery-menu
