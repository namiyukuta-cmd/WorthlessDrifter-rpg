name: One-off index layout
on:
  push:
    branches: [update-index-layout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-index-layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          old='header{height:56px;padding:10px 14px;background:#3c332c;color:#fff;display:flex;align-items:center;justify-content:space-between}.title{font-weight:800}.charline{font-size:11px;opacity:.8;margin-top:2px}.header-actions{display:flex;align-items:center;gap:6px}.header-actions button{border:1px solid #8f7d6c;border-radius:7px;background:#f4e7d7;color:#332b25;padding:7px 9px;font-weight:800}.save-state{font-size:10px;min-width:36px;text-align:center;opacity:.85}'
          new='header{height:56px;padding:8px 8px;background:#3c332c;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px}.title{font-weight:800;font-size:13px;line-height:1.05}.charline{font-size:10px;opacity:.8;margin-top:2px}.header-actions{display:flex;align-items:center;gap:3px;flex:0 0 auto}.header-actions button{border:1px solid #8f7d6c;border-radius:7px;background:#f4e7d7;color:#332b25;padding:6px 5px;font-weight:800;font-size:10px;white-space:nowrap;min-width:0}.save-state{font-size:9px;min-width:28px;text-align:center;opacity:.85}'
          assert old in s, 'header css target not found'
          s=s.replace(old,new,1)
          s=s.replace('.pet-face{text-align:center;font-size:64px}', '.pet-face{text-align:center;font-size:64px}.pet-index-panel{display:none}.pet-index-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}.pet-index-head h2{margin:0}.pet-index-icon{font-size:22px}',1)
          s=s.replace('@media(max-width:390px){:root{--cell:33px}.title{font-size:14px}.stat strong{font-size:17px}}','@media(max-width:390px){:root{--cell:33px}.title{font-size:12px}.header-actions button{font-size:9px;padding:6px 4px}.save-state{min-width:24px}.stat strong{font-size:17px}}',1)
          old_header='<header><div><div class="title">WORTHLESS DRIFTER — prototype</div><div id="headerChar" class="charline">セーブ未選択</div></div><div class="header-actions"><span id="saveState" class="save-state">—</span><button id="saveBtn">SAVE</button><button id="loadBtn">LOAD</button><button id="dataBtn">データ</button></div></header>'
          new_header='<header><div><div class="title">WORTHLESS DRIFTER — prototype</div><div id="headerChar" class="charline">セーブ未選択</div></div><div class="header-actions"><span id="saveState" class="save-state">—</span><button id="homeBtn">HOME</button><button id="saveBtn">SAVE</button><button id="loadBtn">LOAD</button><button id="dataBtn">データ</button></div></header>'
          assert old_header in s, 'header html target not found'
          s=s.replace(old_header,new_header,1)
          old_index='<section id="index" class="screen active"><div class="panel"><h2 id="charIndexName">旅人</h2><div class="stats"><div class="stat"><small>DAY</small><strong id="dayValue">1</strong></div><div class="stat"><small>現在地</small><strong id="locationValue">街道沿い</strong></div><div id="healthStat" class="stat health-stat"><small>体力 <span>タップで回復</span></small><strong id="healthValue">10 / 10</strong></div><div class="stat"><small>所持金</small><strong id="moneyValue">¥380</strong></div><div class="stat"><small>携行重量</small><strong><span id="indexWeight">0.0</span> / 18.0 kg</strong></div></div><div class="buttons"><button data-go="inventory">所持品を開く</button><button data-go="pet">ペットを開く</button></div></div></section>'
          new_index='<section id="index" class="screen active"><div class="panel"><h2 id="charIndexName">旅人</h2><div class="stats"><div class="stat"><small>DAY</small><strong id="dayValue">1</strong></div><div class="stat"><small>現在地</small><strong id="locationValue">街道沿い</strong></div><div id="healthStat" class="stat health-stat"><small>体力 <span>タップで回復</span></small><strong id="healthValue">10 / 10</strong></div><div class="stat"><small>所持金</small><strong id="moneyValue">¥380</strong></div><div class="stat"><small>携行重量</small><strong><span id="indexWeight">0.0</span> / 18.0 kg</strong></div></div></div><div id="petIndexPanel" class="panel pet-index-panel"><div class="pet-index-head"><span id="petIndexIcon" class="pet-index-icon">🐾</span><h2 id="petIndexName">同行動物</h2></div><div class="stats"><div class="stat"><small>体力</small><strong id="petIndexHealth">—</strong></div><div class="stat"><small>携行重量</small><strong id="petIndexWeight">—</strong></div><div class="stat"><small>1日の食料</small><strong id="petIndexFood">—</strong></div><div class="stat"><small>1日の水</small><strong id="petIndexWater">—</strong></div></div></div></section>'
          assert old_index in s, 'index target not found'
          s=s.replace(old_index,new_index,1)
          p.write_text(s)

          p=Path('js/home.js')
          s=p.read_text()
          target="  $('homeNew').onclick=openNewGame;"
          assert target in s, 'home binding target not found'
          s=s.replace(target,target+"\n  if($('homeBtn'))$('homeBtn').onclick=showHome;",1)
          s=s.replace("  closeStorage();\n  closeHealth?.()","  closeStorage();\n  closeSave();\n  closeHealth?.()",1)
          pattern=r"function applyCompanionUi\(\)\{.*?\n\}\nconst originalRenderForCompanion=render;"
          repl="""function applyCompanionUi(){
  let comp=currentCompanion();
  let petNav=document.querySelector('nav button[data-screen=\"pet\"]');
  if(petNav)petNav.style.display=comp?'':'none';
  let indexPanel=$('petIndexPanel');
  if(indexPanel)indexPanel.style.display=comp?'':'none';
  if(!comp)return;
  let face=document.querySelector('#pet .pet-face');
  let name=document.querySelector('#pet .panel:first-child strong');
  let note=document.querySelector('#pet .panel:first-child .note');
  if(face)face.textContent=comp.icon||'🐾';
  if(name)name.textContent=comp.name||comp.label||'同行動物';
  if(note)note.textContent='体力 '+(comp.health??comp.maxHealth??0)+' / '+(comp.maxHealth??comp.health??0)+' ・ 1日 食料 '+(comp.dailyFood??0)+' ／ 水 '+(comp.dailyWater??0);
  if($('petIndexIcon'))$('petIndexIcon').textContent=comp.icon||'🐾';
  if($('petIndexName'))$('petIndexName').textContent=comp.name||comp.label||'同行動物';
  if($('petIndexHealth'))$('petIndexHealth').textContent=(comp.health??comp.maxHealth??0)+' / '+(comp.maxHealth??comp.health??0);
  if($('petIndexWeight'))$('petIndexWeight').textContent=topWeight('pet').toFixed(1)+' / '+Number(state.petMax??0).toFixed(1)+' kg';
  if($('petIndexFood'))$('petIndexFood').textContent=String(comp.dailyFood??0);
  if($('petIndexWater'))$('petIndexWater').textContent=String(comp.dailyWater??0)
}
const originalRenderForCompanion=render;"""
          s2,n=re.subn(pattern,repl,s,flags=re.S)
          assert n==1, f'companion ui target count={n}'
          p.write_text(s2)
          PY
      - name: Check JavaScript
        run: node --check js/home.js
      - name: Commit result and remove workflow
        run: |
          rm .github/workflows/oneoff-index-layout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/home.js .github/workflows/oneoff-index-layout.yml
          git commit -m "Update index layout"
          git push origin HEAD:update-index-layout
