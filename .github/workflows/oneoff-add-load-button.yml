name: oneoff-add-load-button
on:
  push:
    branches:
      - add-load-button
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Add explicit LOAD button'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch load UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<button id="saveBtn">SAVE</button><button id="dataBtn">データ</button>','<button id="saveBtn">SAVE</button><button id="loadBtn">LOAD</button><button id="dataBtn">データ</button>')
          s=s.replace('>このキャラで遊ぶ</button>','>LOAD</button>')
          s=s.replace("$('saveBtn').addEventListener('click',saveCurrent);$('dataBtn').addEventListener('click',()=>openSave());","$('saveBtn').addEventListener('click',saveCurrent);$('loadBtn').addEventListener('click',()=>openSave());$('dataBtn').addEventListener('click',()=>openSave());")
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/oneoff-add-load-button.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/oneoff-add-load-button.yml
          git commit -m "Add explicit LOAD button"
          git push
