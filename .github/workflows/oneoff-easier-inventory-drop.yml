name: oneoff-easier-inventory-drop
on:
  push:
    branches:
      - fix-easier-inventory-drop
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply easier inventory drop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drag and drop
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function under(x,y)')
          end = s.index('function toast(t)', start)
          new = """function under(x,y){if(drag?.ghost)drag.ghost.style.display='none';let u=document.elementFromPoint(x,y);if(drag?.ghost)drag.ghost.style.display='';return u}\nfunction gridNear(x,y,pad=22){let best=null,bestD=Infinity;document.querySelectorAll('.grid').forEach(g=>{let r=g.getBoundingClientRect();if(x<r.left-pad||x>r.right+pad||y<r.top-pad||y>r.bottom+pad)return;let dx=x<r.left?r.left-x:x>r.right?x-r.right:0,dy=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0,d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=g}});return best}\nfunction mark(x,y){document.querySelectorAll('.grid.over,.loose.over').forEach(x=>x.classList.remove('over'));let direct=under(x,y)?.closest('.grid,.loose');(direct||gridNear(x,y))?.classList.add('over')}\nfunction bestDrop(g,it,px,py){let id=g.dataset.grid,s=spec(id);if(!id||!s)return null;let c=cell(),r=g.getBoundingClientRect(),maxX=s.cols-it.w,maxY=s.rows-it.h;if(maxX<0||maxY<0)return null;let x=Math.round((px-r.left-2-it.w*c/2)/c),y=Math.round((py-r.top-2-it.h*c/2)/c);x=Math.max(0,Math.min(maxX,x));y=Math.max(0,Math.min(maxY,y));if(fits(it,id,x,y))return{x,y};let candidates=[];for(let yy=Math.max(0,y-1);yy<=Math.min(maxY,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(maxX,x+1);xx++)if(fits(it,id,xx,yy)){let cx=r.left+2+(xx+it.w/2)*c,cy=r.top+2+(yy+it.h/2)*c;candidates.push({x:xx,y:yy,d:(cx-px)**2+(cy-py)**2})}candidates.sort((a,b)=>a.d-b.d);return candidates[0]||null}\nfunction up(e){if(!drag)return;window.removeEventListener('pointermove',dragMove);document.querySelectorAll('.grid.over,.loose.over').forEach(x=>x.classList.remove('over'));let d=drag;drag=null;d.src.classList.remove('src');d.ghost?.remove();let it=item(d.id);if(!d.moved){it.inner?openStorage(it.id):info(it);return}let els=document.querySelectorAll('[data-item=\"'+it.id+'\"]');els.forEach(x=>x.style.pointerEvents='none');let u=document.elementFromPoint(e.clientX,e.clientY);els.forEach(x=>x.style.pointerEvents='');if(u?.closest('#loose'))return toLoose(it.id);let g=u?.closest('.grid')||gridNear(e.clientX,e.clientY);if(!g)return toast('移動をキャンセルしました');let pos=bestDrop(g,it,e.clientX,e.clientY);if(!pos)return toast('そこには入りません');move(it.id,g.dataset.grid,pos.x,pos.y)}\n"""
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          Path('.github/workflows/oneoff-easier-inventory-drop.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/oneoff-easier-inventory-drop.yml
          git commit -m "Apply easier inventory drop"
          git push
