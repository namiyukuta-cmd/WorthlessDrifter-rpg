name: temporary-consumables-pr
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'add-consumables'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-consumables
      - name: Apply patch
        run: python .github/patch-consumables.py
      - name: Clean temporary files
        run: rm -f .github/patch-consumables.py .github/trigger-consumables .github/workflows/oneoff-consumables.yml
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add eating and drinking"
          git push origin HEAD:add-consumables
