name: fix-needs-meter
on:
  push:
    branches:
      - fix-needs-meter
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix needs meter direction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix needs meter direction
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<small>空腹</small><strong id="hungerValue">2 / 10</strong>','<small>満腹度</small><strong id="hungerValue">2 / 10</strong>',1)
          s=s.replace('<small>喉の渇き</small><strong id="thirstValue">2 / 10</strong>','<small>水分</small><strong id="thirstValue">2 / 10</strong>',1)
          s=s.replace("if((state.hunger??0)<=0)return toast('今はお腹が空いていません');state.hunger=Math.max(0,(state.hunger??0)-(c.amount||1));","if((state.hunger??0)>=(state.maxHunger??10))return toast('もう十分に満腹です');state.hunger=Math.min(state.maxHunger??10,(state.hunger??0)+(c.amount||1));",1)
          s=s.replace("if((state.thirst??0)<=0)return toast('今は喉が渇いていません');state.thirst=Math.max(0,(state.thirst??0)-(c.amount||1));","if((state.thirst??0)>=(state.maxThirst??10))return toast('水分は十分です');state.thirst=Math.min(state.maxThirst??10,(state.thirst??0)+(c.amount||1));",1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-needs-meter.yml').unlink()
          Path('.github/fix-needs-trigger').unlink(missing_ok=True)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix needs meter direction"
          git push
