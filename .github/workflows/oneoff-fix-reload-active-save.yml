name: oneoff-fix-reload-active-save
on:
  push:
    branches:
      - fix-load-save-manager
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Allow reloading active save'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix active save reload
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function loadSlot(id)')
          end=s.index('async function renameSlot',start)
          new="""function loadSlot(id){let slot=store.slots[id];if(!slot)return;if(dirty&&!confirm('保存していない変更があります。GitHubの保存時点をロードしますか？'))return;activeId=id;state=clone(slot.state);state.characterName=slot.name||state.characterName||'旅人';dirty=false;closeStorage();closeSave();render();updateSaveState();toast('ロードしました')}\n"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/oneoff-fix-reload-active-save.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/oneoff-fix-reload-active-save.yml
          git commit -m "Allow reloading active save"
          git push
