name: Patch save flow
on:
  push:
    branches: [match-ironsworn-save-flow]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: match-ironsworn-save-flow
      - name: Match Ironsworn save behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ("キャラクターごとにGitHubの <b>save-data</b> ブランチへJSONファイルとして保存します。ゲーム状態は端末保存しません。","キャラクターごとにGitHubの <b>main</b> ブランチの <b>saves/characters</b> へJSONファイルとして保存します。"),
            ("トークンはこのタブの中だけに保持し、GitHubへコミットしません。","トークンはこのiPhoneに保持し、GitHubへコミットしません。"),
            ("const GH_OWNER='namiyukuta-cmd',GH_REPO='WorthlessDrifter-rpg',SAVE_BRANCH='save-data',SAVE_DIR='saves',TOKEN_KEY='drifter-github-token-session';","const GH_OWNER='namiyukuta-cmd',GH_REPO='WorthlessDrifter-rpg',SAVE_BRANCH='main',SAVE_DIR='saves/characters',TOKEN_KEY='drifter-github-token-local';"),
            ("githubToken=sessionStorage.getItem(TOKEN_KEY)||'';","githubToken=localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem('drifter-github-token-session')||'';if(githubToken){localStorage.setItem(TOKEN_KEY,githubToken);sessionStorage.removeItem('drifter-github-token-session')}"),
            ("sessionStorage.setItem(TOKEN_KEY,githubToken);","localStorage.setItem(TOKEN_KEY,githubToken);"),
            ("sessionStorage.removeItem(TOKEN_KEY);","localStorage.removeItem(TOKEN_KEY);"),
            ("render();updateGitHubStatus();openSave();","render();updateGitHubStatus();refreshSaves();")
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('missing expected text: '+old[:100])
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/patch-save-flow.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/patch-save-flow.yml
          git commit -m "Match save flow to working Ironsworn implementation"
          git push origin HEAD:match-ironsworn-save-flow
