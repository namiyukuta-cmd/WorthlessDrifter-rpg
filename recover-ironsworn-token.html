<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub連携を復旧</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#f5eee4;color:#332b25;margin:0;padding:24px}.box{max-width:520px;margin:12vh auto;background:#fffaf3;border:1px solid #ad9985;border-radius:14px;padding:20px}button{width:100%;padding:14px;border:1px solid #806c59;border-radius:10px;background:#f0dfca;font:inherit;font-weight:700}.status{margin:14px 0;line-height:1.7;font-size:14px}</style><div class="box"><h2>GitHub連携を復旧</h2><div id="status" class="status">Ironswornで使っていた認証を探しています…</div><button id="go" hidden>ゲームへ戻る</button></div><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('go');const keys=[['localStorage','ironsworn-github-token-local-v1'],['sessionStorage','ironsworn-github-token-session-v1']];let token='';for(const [where,key] of keys){try{token=(where==='localStorage'?localStorage:sessionStorage).getItem(key)||''}catch(e){}if(token)break}if(!token){s.textContent='このiPhoneには、IronswornのGitHub連携情報が保存されていませんでした。新しいトークンは作らず、ここで止めます。';return}try{const r=await fetch('https://api.github.com/user',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}});if(!r.ok){s.textContent='Ironswornに残っていた認証も、現在はGitHubに認証されませんでした。新しいトークンは作らず、ここで止めます。';return}localStorage.setItem('drifter-github-token-local',token);try{sessionStorage.removeItem('drifter-github-token-session')}catch(e){}s.textContent='Ironswornで使っていたGitHub認証を、このゲームへ引き継ぎました。';b.hidden=false;b.onclick=()=>location.href='./';}catch(e){s.textContent='GitHubへの確認通信に失敗しました。';}})();</script>
